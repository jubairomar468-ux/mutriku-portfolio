<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 440" role="img" aria-label="Oscillating water column mechanism"><title>Oscillating water column mechanism</title><desc>A submerged opening links the sea to a chamber. Rising and falling water drives air through a turbine above the water, which is coupled to a generator. Schematic, not to scale.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto-start-reverse"><path d="M0 0L6 3L0 6" fill="#087f83"/></marker></defs><rect x="20" y="112" width="730" height="298" fill="#f1f5ef"/><path d="M20 290Q70 265 120 290T220 290T320 290L380 290V410H20Z" fill="#a9d9df"/><rect x="415" y="310" width="235" height="100" fill="#a9d9df"/><g class="water-rise"><rect x="415" y="270" width="235" height="100" fill="#a9d9df"/><path d="M415 270Q470 255 525 270T650 270" fill="#a9d9df" stroke="#087f83" stroke-width="3"/></g><rect x="380" y="105" width="35" height="205" fill="#8faaa8"/><rect x="650" y="105" width="35" height="305" fill="#8faaa8"/><rect x="380" y="105" width="110" height="25" fill="#8faaa8"/><rect x="560" y="105" width="125" height="25" fill="#8faaa8"/><rect x="380" y="410" width="305" height="22" fill="#8faaa8"/><path d="M490 105V40H560V105" stroke="#718d8d" stroke-width="7" fill="none"/><circle cx="525" cy="74" r="25" fill="#d6ee92" stroke="#102b3d" stroke-width="2"/><g class="rotor" stroke="#102b3d" stroke-width="4"><path d="M525 52V96M503 74H547M510 59L540 89M510 89L540 59"/></g><path d="M551 74H675" stroke="#102b3d" stroke-width="5"/><rect x="675" y="42" width="145" height="65" rx="4" fill="#102b3d"/><text x="747" y="82" text-anchor="middle" fill="white" style="fill:white" font-size="19">Generator</text><g class="air-flow"><path d="M560 220V150" stroke="#087f83" stroke-width="5" marker-end="url(#arrow)"/></g><path d="M235 342H450" stroke="#087f83" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="75" y="190" font-size="25">Sea</text><text x="430" y="183" font-size="18">Air chamber</text><text x="458" y="380" font-size="19">Water column</text><text x="260" y="391" text-anchor="middle" font-size="16">Submerged opening</text><text x="470" y="24" font-size="17">Air turbine</text><text x="32" y="235" font-size="16">Wave motion</text><text x="690" y="160" font-size="15">Breakwater</text></svg>