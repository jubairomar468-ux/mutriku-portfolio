<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" role="img" aria-label="Life-cycle climate-change contributions"><title>Life-cycle climate-change contributions</title><desc>Construction 195, operation and maintenance 12.4, and end of life 17.9 grams CO2-equivalent per kilowatt-hour. Rounded components sum to 225.3; the paper reports 226 overall.</desc><text x="20" y="30" font-size="17">g CO₂e per kWh · 20-year model</text><rect x="20" y="55" width="610" height="53" fill="#102b3d"/><rect x="630" y="55" width="39" height="53" fill="#087f83"/><rect x="669" y="55" width="56" height="53" fill="#b1ce80"/><text x="40" y="89" fill="white" style="fill:white" font-size="20">Construction: 195</text><rect x="20" y="140" width="14" height="14" fill="#102b3d"/><text x="43" y="153" font-size="16">Construction · 86.6%</text><rect x="310" y="140" width="14" height="14" fill="#087f83"/><text x="333" y="153" font-size="16">Operation · 12.4</text><rect x="550" y="140" width="14" height="14" fill="#b1ce80"/><text x="573" y="153" font-size="16">End of life · 17.9</text><rect x="20" y="185" width="705" height="53" fill="#fff5e7" stroke="#b48651" stroke-dasharray="5 4"/><text x="36" y="218" font-size="16">Missing dismantling data were assigned zero emissions.</text></svg>