<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="output-title output-desc"><title id="output-title">Forecast, measured output and cumulative-record estimate</title><desc id="output-desc">2012 forecast: 600 MWh per year. Measured mean for 2014–2016: 246.4687 MWh per year. Rounded historical estimate from 3000 MWh divided by 12.5 years: approximately 240 MWh per year; the reported cumulative total exceeded 3000 MWh.</desc><text x="20" y="29" font-size="17" font-weight="600">Annual electricity (MWh/year)</text><text x="20" y="65" font-size="16">Forecast published in 2012 [3]</text><rect x="20" y="79" width="630" height="36" fill="#cbd7d4"/><text x="665" y="104" font-size="20">600</text><text x="20" y="151" font-size="16">Measured mean, 2014–2016 [2]</text><rect x="20" y="165" width="258.79" height="36" fill="#087f83"/><text x="295" y="190" font-size="20">246.5</text><text x="20" y="237" font-size="16">Rounded estimate, first 12.5 years [13]</text><rect x="20" y="251" width="252" height="36" fill="#91b9ce"/><text x="288" y="276" font-size="20">≈240*</text><text x="20" y="325" font-size="15">*3000 ÷ 12.5; “over 3 GWh” implies a mean above 240.</text><text x="20" y="353" font-size="15">246.4687 ÷ 600 × 100 = 41.1% of the earlier forecast.</text></svg>